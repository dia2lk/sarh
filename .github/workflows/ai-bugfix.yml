name: AI bug-fix request

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-bugfix:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/ai-fix' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: ./.github/workflows/ai-bugfix-reusable.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      setup-command: |
        npm ci
        npx playwright install --with-deps chromium
      validation-command: |
        npm run build
        npm run test:e2e
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
