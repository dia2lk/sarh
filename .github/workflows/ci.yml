# ============================================
# صرح للخدمات القانونية والمحاسبية
# CI/CD — GitHub Actions
# ============================================

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_FB_PIXEL_ID: ${{ secrets.VITE_FB_PIXEL_ID }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          VITE_AI_API_ENDPOINT: ${{ secrets.VITE_AI_API_ENDPOINT }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Verify build output
        run: |
          echo "📊 Build Output:"
          ls -la dist/
          echo ""
          echo "📁 Assets:"
          ls -la dist/assets/
          echo ""
          echo "📄 Static files:"
          ls dist/*.html dist/*.txt dist/*.xml 2>/dev/null || true
          echo ""
          echo "✅ Build verification complete"
